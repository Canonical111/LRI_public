[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lri-dressed-phi4-hpc"
version = "1.1.0rc1"
description = "Matrix-free product-regulator dressed phi4 Hamiltonian truncation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "numba>=0.59", "threadpoolctl>=3"]

[project.optional-dependencies]
validation = ["pytest>=7", "psutil>=5"]

[project.scripts]
lri-dressed = "lri_dressed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
