[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lri-c8-hpc"
version = "0.1.0"
description = "Residual-form eighth-order long-range Ising Hamiltonian truncation"
requires-python = ">=3.10"
# Lower bounds = the symmetry anaconda3/2023.07-2 stack (validated); newer stacks also pass.
dependencies = ["numpy>=1.24", "numba>=0.57", "scipy>=1.10", "threadpoolctl>=2.2"]
[project.optional-dependencies]
validation = ["pytest>=7", "sympy>=1.12", "mpmath>=1.3"]
[tool.setuptools.packages.find]
where = ["src"]
[project.scripts]
lri-c8 = "lri_c8._entry:main"
