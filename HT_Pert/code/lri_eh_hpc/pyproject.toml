[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lri-eh-hpc"
version = "0.2.0"
description = "Validated correction-only effective-Hamiltonian HPC addon"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.59"]
[project.optional-dependencies]
validation = ["scipy>=1.10", "sympy>=1.12", "pytest>=7"]
[tool.setuptools.packages.find]
include = ["lri_eh*"]
